name: token-usage-tracker
display_name: Token 用量追踪
version: 3.38.0
description: 每次回答结束后弹出 Windows 系统通知（toast），显示本条真实 Token 消耗、耗时与费用。支持每日分模型账本（各模型输入/输出/缓存命中/总 token/金额 + 当日合计，长期保存可查历史，--report 查看；v3.20.0 起支持区间/周月/任意日期段汇总 + CSV 导出 + 消耗外推）、轮次明细留档（每轮一条，含分模型明细与可读标签）、今日累计消费、DeepSeek 高峰/夜间时段标注与周末低峰（官方定价直连抓取，含生效时间自动跟随）、自定义 API 实时余额、专家团/多子回合自动聚合只弹一次、多会话隔离统计。v3.21.0 起每周匿名查一次仓库版本（只读、零密钥），有新版本时在回答末尾提示一句（每版本最多 2 次）；v3.22.0 起同时查 release 与 tag 取较大者，并给未配 UserPromptSubmit hook 的机器加弹窗标记兜底。价格按官方人民币价每日多源自动刷新（DeepSeek 官方直连优先 + 聚合源兜底）+ 新模型自动补录。统计范围：本技能统计的是 WorkBuddy 落盘的消耗，不等于账上被扣的全部消耗——长思考中途手动停止的部分本地不落盘、只能估算且偏差方向不确定，内置积分模式的额度扣减也读不到，对账请以服务商账单/积分记录为准。token 用量为平台落盘的实测值；金额为按 API 单价折算的等价计价——自备 API key 模式下等同真实花费，内置模型模式下只是参考值、与客户端积分/额度无换算关系。默认零密钥联网。v3.22.1 起文档新增「怎么问 → 得到什么表」对照与真实输出示例：直接问模型就能拿到今天 / 某一天 / 近 7 天 / 本月 / 任意日期区间 / 消耗外推 / CSV 导出等不同表格。零第三方依赖（必须整目录部署：主脚本 require 同目录 peak-rules.js / refresh-holidays.js）。
category: productivity
author: abc1317679842-ui
license: MIT
platforms:
  - windows
requires:
  - workbuddy-desktop
