name: token-usage-tracker
display_name: Token 用量追踪
version: 3.21.0
description: 每次回答结束后弹出 Windows 系统通知（toast），显示本条真实 Token 消耗、耗时与费用。支持每日分模型账本（各模型输入/输出/缓存命中/总 token/金额 + 当日合计，长期保存可查历史，--report 查看；v3.20.0 起支持区间/周月/任意日期段汇总 + CSV 导出 + 消耗外推）、轮次明细留档（每轮一条，含分模型明细与可读标签）、今日累计消费、DeepSeek 高峰/夜间时段标注与周末低峰（官方定价直连抓取，含生效时间自动跟随）、自定义 API 实时余额、专家团/多子回合自动聚合只弹一次、多会话隔离统计。v3.21.0 起每周匿名查一次 GitHub releases（只读、零密钥），有新版本时在回答末尾提示一句（每版本最多 2 次）。价格按官方人民币价每日多源自动刷新（DeepSeek 官方直连优先 + 聚合源兜底）+ 新模型自动补录。token 用量为平台落盘的实测值；金额为按 API 单价折算的等价计价——自备 API key 模式下等同真实花费，内置模型模式下只是参考值、与客户端积分/额度无换算关系。默认零密钥联网。零依赖单文件。
category: productivity
author: abc1317679842-ui
license: MIT
platforms:
  - windows
requires:
  - workbuddy-desktop
