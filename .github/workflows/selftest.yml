# selftest CI（v3.23.2 起）：每次 push 自动在干净的 Windows runner 上跑全套离线自测。
# 用 windows-latest：selftest 的 watcher/toast/PowerShell 相关断言依赖 Windows 行为。
# 零依赖：不装任何包，正好验证「零依赖单文件」这个卖点没被悄悄破坏。
# WB_NO_NET=1：让 refresh-prices / deepseek-official 走模拟断网路径。
# ⚠ 副作用：selftest 的 T3-R4「⚠价库告警」断言在**离线这一跑**不会执行。
#   v3.48.0（审计 S3）：补第二个 step——**不设 WB_NO_NET** 再跑一遍，让 T3-R4 在 CI 也有覆盖。
#   判据来自 v3.29.0 的有意设计：envSkip 只跳过"前提不成立"的用例（S3 复核确认不是门禁绕过），
#   但 T3-R4 属"两种模式都该验"（T12 mkVariant 双环境范式），离线跑 + 联网跑各一遍才闭环。
#   该 step 允许失败（continue-on-error）——runner 网络抖动不该让整条 CI 常红而被习惯性忽略。
# 注：selftest 内部已自设 TOKEN_TRACKER_NO_TOAST=1 + WB_ROOT=os.tmpdir() 隔离，不碰真实账本。
name: selftest

on:
  push:
    branches: [main]
    # 只挂 main（default_branch）：历史上每次推送 master+main 双镜像会让每个 commit 跑两遍 CI。
    # v3.23.4：master 镜像分支已删除（单分支），双跑问题从源头消失。
  # v3.49.0（审计 G12）：补 PR 触发 —— 改前只有 push main 才跑，特性分支上的回归要到**合并后**才暴露，
  #   门禁形同虚设。PR 与 push 跑同一套断言（无重复定义，仅触发面扩大）。
  pull_request:
    branches: [main]

jobs:
  selftest:
    runs-on: windows-latest
    # v3.59.0（审计批15 · M40）：Node 版本矩阵 —— 改前只跑 20，而本机实际是 22；
    #   语法/API 差异（如 AbortSignal.timeout、fs.rmSync 行为）只在对应版本上才暴露。
    #   fail-fast:false —— 一个版本红也要看另一个版本的结果，避免"修好 20 又炸 22"来回试错。
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Verify runner can spawn node subprocesses (selftest 前提)
        run: node -e "const r=require('child_process').spawnSync(process.execPath,['-e','console.log(1)']); if(r.status!==0){console.error('spawn 探测失败：本 runner 上 selftest 的端到端用例会静默跳过');process.exit(1)} console.log('spawn OK')"
      # v3.49.0（审计 G12）：Python 三脚本语法守卫 —— selftest 的 T0 只做 JS 的 `node --check`，
      #   价格流水线三个 .py 此前**零 CI 覆盖**（语法回归无拦截；本地 py_compile 靠人记着）。
      #   不设 continue-on-error：语法错误是确定性回归，该红就红。
      - name: Syntax check Python price-pipeline scripts
        run: python -m py_compile fetch-cn-prices.py parse_tokenhub.py build_index.py
      # v3.59.0（审计批15 · M40）：凭据扫描。零依赖自研脚本（理由见脚本头注释：
      #   不引第三方 action，是为了保住"零依赖单文件"这个卖点、也不把 CI 可信度押在别人仓库上）。
      - name: Secret & credential scan (zero-dependency)
        run: node .github/workflows/secret-scan.js
      - name: Run selftest (offline, isolated)
        run: node selftest.js
        env:
          WB_NO_NET: '1'
      # v3.48.0（审计 S3）：联网再跑一遍，专门覆盖 T3-R4「⚠价库告警」（离线跑会 envSkip 掉它）。
      #   两者是**不同模式**而非重复：离线跑锁"断网自愈"路径，联网跑锁"价库告警"路径。
      # v3.59.0（审计批15 · M39）：**去掉 continue-on-error** —— 原写法把"真回归"与"runner 网络抖动"
      #   一并吞掉（网络一抖，这一遍等于没跑，且绿灯照给）。改为**先探测网络可达性**：
      #     可达 → 这一遍必须红（真回归拦得住）；不可达 → 整步跳过（不假红，也不假装跑过）。
      #   这样"没跑"是显式的（job 日志里看得到 skip 原因），不再是静默放过。
      # v3.59.1（审计批17·中危）：**探针目标改成型库源本身**。改前探 api.github.com，但联网这一遍
      #   的真实依赖是价库七源（T3 要靠重建 pricing.json，走 refresh-prices.js 的 SOURCES）——
      #   GitHub 通、portkey/llmabacus 挂 → 探针放行 → selftest 因抓不到价而红 → 又是一个没有解释的
      #   红，正是 M39 想消灭的东西。判据与重建逻辑对齐：**任一源可达即放行**（重建只需"至少一个
      #   USD 源可用"，见 refresh-prices.js 的 usdOk 判定）。逐源打印结果，便于区分"全挂"与"只挂一个"。
      - name: Probe network reachability (gate for the online run)
        id: net
        shell: bash
        run: |
          ok=0
          for u in https://configs.portkey.ai/pricing/deepseek.json \
                   https://openrouter.ai/api/v1/models \
                   https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json \
                   https://www.llmabacus.com/api/prices; do
            if node -e "fetch(process.argv[1],{signal:AbortSignal.timeout(8000)}).then(function(r){process.exit(r.ok?0:1)}).catch(function(){process.exit(1)})" "$u"; then
              echo "  可达: $u"; ok=1
            else
              echo "  不可达: $u"
            fi
          done
          if [ "$ok" = "1" ]; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::价库源均不可达 → 跳过联网那一遍 selftest（T3-R4 本轮无覆盖，属环境问题不是通过）"
          fi
      # v3.59.1（审计批17·中危）：把"这一遍到底跑没跑"变成**显式注解**。跳过时 job 仍是绿的
      #   （这是有意的：runner 网络抖动不该判红），但绿与"绿但没覆盖"必须可区分 —— 以前只能去
      #   翻步骤列表，现在 job summary 里直接有一行 notice。
      - name: Online coverage marker
        if: always()
        run: |
          if [ "${{ steps.net.outputs.reachable }}" = "true" ]; then
            echo "::notice::联网那一遍已执行（T3-R4 价库告警路径有覆盖）"
          else
            echo "::notice::联网那一遍被跳过（T3-R4 本轮无覆盖，属环境问题；见上方 warning）"
          fi
      - name: Run selftest (online, covers T3-R4 price-library warning)
        if: steps.net.outputs.reachable == 'true'
        run: node selftest.js
