# selftest CI（v3.23.2 起）：每次 push 自动在干净的 Windows runner 上跑全套离线自测。
# 用 windows-latest：selftest 的 watcher/toast/PowerShell 相关断言依赖 Windows 行为。
# 零依赖：不装任何包，正好验证「零依赖单文件」这个卖点没被悄悄破坏。
# WB_NO_NET=1：让 refresh-prices / deepseek-official 走模拟断网路径。
# ⚠ 副作用：selftest 的 T3-R4「⚠价库告警」断言在**离线这一跑**不会执行。
#   v3.48.0（审计 S3）：补第二个 step——**不设 WB_NO_NET** 再跑一遍，让 T3-R4 在 CI 也有覆盖。
#   判据来自 v3.29.0 的有意设计：envSkip 只跳过"前提不成立"的用例（S3 复核确认不是门禁绕过），
#   但 T3-R4 属"两种模式都该验"（T12 mkVariant 双环境范式），离线跑 + 联网跑各一遍才闭环。
#   该 step 允许失败（continue-on-error）——runner 网络抖动不该让整条 CI 常红而被习惯性忽略。
# 注：selftest 内部已自设 TOKEN_TRACKER_NO_TOAST=1 + WB_ROOT=os.tmpdir() 隔离，不碰真实账本。
name: selftest

on:
  push:
    branches: [main]
    # 只挂 main（default_branch）：历史上每次推送 master+main 双镜像会让每个 commit 跑两遍 CI。
    # v3.23.4：master 镜像分支已删除（单分支），双跑问题从源头消失。
  # v3.49.0（审计 G12）：补 PR 触发 —— 改前只有 push main 才跑，特性分支上的回归要到**合并后**才暴露，
  #   门禁形同虚设。PR 与 push 跑同一套断言（无重复定义，仅触发面扩大）。
  pull_request:
    branches: [main]

jobs:
  selftest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify runner can spawn node subprocesses (selftest 前提)
        run: node -e "const r=require('child_process').spawnSync(process.execPath,['-e','console.log(1)']); if(r.status!==0){console.error('spawn 探测失败：本 runner 上 selftest 的端到端用例会静默跳过');process.exit(1)} console.log('spawn OK')"
      # v3.49.0（审计 G12）：Python 三脚本语法守卫 —— selftest 的 T0 只做 JS 的 `node --check`，
      #   价格流水线三个 .py 此前**零 CI 覆盖**（语法回归无拦截；本地 py_compile 靠人记着）。
      #   不设 continue-on-error：语法错误是确定性回归，该红就红。
      - name: Syntax check Python price-pipeline scripts
        run: python -m py_compile fetch-cn-prices.py parse_tokenhub.py build_index.py
      - name: Run selftest (offline, isolated)
        run: node selftest.js
        env:
          WB_NO_NET: '1'
      # v3.48.0（审计 S3）：联网再跑一遍，专门覆盖 T3-R4「⚠价库告警」（离线跑会 envSkip 掉它）。
      #   两者是**不同模式**而非重复：离线跑锁"断网自愈"路径，联网跑锁"价库告警"路径。
      #   continue-on-error：GitHub runner 的外网偶发抖动属环境问题，不该把 CI 变成常红噪音。
      - name: Run selftest (online, covers T3-R4 price-library warning)
        continue-on-error: true
        run: node selftest.js
